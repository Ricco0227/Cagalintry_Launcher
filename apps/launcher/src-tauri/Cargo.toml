[package]
name = "cagalintry-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Cagalintry Launcher"

[[bin]]
name = "cagalintry-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
cagalintry-proto.workspace = true
cagalintry-net.workspace = true
cagalintry-mc.workspace = true
cagalintry-auth.workspace = true
cagalintry-modrinth.workspace = true
cagalintry-sync.workspace = true

# `protocol-asset` lets the webview load instance cover art and skin renders
# straight from the launcher's data directory instead of base64-inlining them.
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

sqlx.workspace = true
uuid.workspace = true
time.workspace = true
dirs.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
